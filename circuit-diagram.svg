<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="470" fill="#ffffff"/>

  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Smart Spirometer Circuit</text>

  <!-- ===== Wires (drawn first so blocks sit on top) ===== -->
  <!-- Battery -> module -->
  <line x1="200" y1="170" x2="290" y2="170" stroke="#d62828" stroke-width="4"/>
  <line x1="200" y1="270" x2="290" y2="270" stroke="#222" stroke-width="4"/>
  <text x="245" y="160" text-anchor="middle" font-size="13" fill="#d62828">3.7 V</text>

  <!-- Module -> ESP32 -->
  <line x1="500" y1="170" x2="590" y2="170" stroke="#d62828" stroke-width="4"/>
  <line x1="500" y1="270" x2="590" y2="270" stroke="#222" stroke-width="4"/>
  <text x="545" y="160" text-anchor="middle" font-size="13" fill="#d62828">5 V</text>

  <!-- ESP32 -> VL53L0X -->
  <line x1="770" y1="130" x2="880" y2="130" stroke="#f77f00" stroke-width="4"/>
  <line x1="770" y1="190" x2="880" y2="190" stroke="#222" stroke-width="4"/>
  <line x1="770" y1="250" x2="880" y2="250" stroke="#1d70b8" stroke-width="4"/>
  <line x1="770" y1="310" x2="880" y2="310" stroke="#2a9d3f" stroke-width="4"/>
  <text x="825" y="120" text-anchor="middle" font-size="13" fill="#f77f00">3.3 V</text>
  <text x="825" y="240" text-anchor="middle" font-size="13" fill="#1d70b8">SDA</text>
  <text x="825" y="300" text-anchor="middle" font-size="13" fill="#2a9d3f">SCL</text>

  <!-- ===== Battery ===== -->
  <rect x="40" y="130" width="160" height="180" rx="10" fill="#fff4d6" stroke="#222" stroke-width="2"/>
  <rect x="100" y="120" width="40" height="10" fill="#222"/>
  <text x="120" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Li-ion Battery</text>
  <text x="120" y="228" text-anchor="middle" font-size="14" fill="#444">3.7 V</text>
  <text x="120" y="248" text-anchor="middle" font-size="14" fill="#444">1100 mAh</text>
  <text x="185" y="175" text-anchor="end" font-size="18" font-weight="bold" fill="#d62828">+</text>
  <text x="185" y="276" text-anchor="end" font-size="20" font-weight="bold" fill="#222">−</text>
  <circle cx="200" cy="170" r="5" fill="#222"/>
  <circle cx="200" cy="270" r="5" fill="#222"/>

  <!-- ===== Charge / boost module ===== -->
  <rect x="290" y="110" width="210" height="220" rx="8" fill="#e8f1fb" stroke="#222" stroke-width="2"/>
  <text x="395" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Charge / Boost Module</text>
  <text x="302" y="175" font-size="13" fill="#222">BAT+</text>
  <text x="302" y="275" font-size="13" fill="#222">BAT−</text>
  <text x="488" y="175" text-anchor="end" font-size="13" fill="#222">OUT+</text>
  <text x="488" y="275" text-anchor="end" font-size="13" fill="#222">OUT−</text>
  <!-- potentiometer symbol -->
  <polyline points="350,220 360,220 365,210 375,230 385,210 395,230 405,210 415,230 425,210 430,220 440,220" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="355" y1="242" x2="430" y2="200" stroke="#222" stroke-width="2"/>
  <polygon points="430,200 419,201 425,210" fill="#222"/>
  <text x="395" y="262" text-anchor="middle" font-size="12" fill="#444">pot trimmed to 5 V</text>
  <circle cx="290" cy="170" r="5" fill="#222"/>
  <circle cx="290" cy="270" r="5" fill="#222"/>
  <circle cx="500" cy="170" r="5" fill="#222"/>
  <circle cx="500" cy="270" r="5" fill="#222"/>

  <!-- ===== ESP32 ===== -->
  <rect x="590" y="80" width="180" height="290" rx="8" fill="#e9f7ec" stroke="#222" stroke-width="2"/>
  <text x="680" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ESP32 DevKit V1</text>
  <text x="602" y="175" font-size="13" fill="#222">VIN</text>
  <text x="602" y="275" font-size="13" fill="#222">GND</text>
  <text x="758" y="135" text-anchor="end" font-size="13" fill="#222">3V3</text>
  <text x="758" y="195" text-anchor="end" font-size="13" fill="#222">GND</text>
  <text x="758" y="255" text-anchor="end" font-size="13" fill="#222">D21</text>
  <text x="758" y="315" text-anchor="end" font-size="13" fill="#222">D22</text>
  <text x="680" y="350" text-anchor="middle" font-size="11" fill="#666">WiFi AP 192.168.4.1</text>
  <circle cx="590" cy="170" r="5" fill="#222"/>
  <circle cx="590" cy="270" r="5" fill="#222"/>
  <circle cx="770" cy="130" r="5" fill="#222"/>
  <circle cx="770" cy="190" r="5" fill="#222"/>
  <circle cx="770" cy="250" r="5" fill="#222"/>
  <circle cx="770" cy="310" r="5" fill="#222"/>

  <!-- ===== VL53L0X ===== -->
  <rect x="880" y="100" width="180" height="240" rx="8" fill="#f3eafb" stroke="#222" stroke-width="2"/>
  <text x="970" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">VL53L0X ToF Sensor</text>
  <text x="892" y="135" font-size="13" fill="#222">VIN</text>
  <text x="892" y="195" font-size="13" fill="#222">GND</text>
  <text x="892" y="255" font-size="13" fill="#222">SDA</text>
  <text x="892" y="315" font-size="13" fill="#222">SCL</text>
  <text x="1030" y="228" text-anchor="middle" font-size="11" fill="#666" transform="rotate(90 1030 228)">aimed at piston</text>
  <circle cx="880" cy="130" r="5" fill="#222"/>
  <circle cx="880" cy="190" r="5" fill="#222"/>
  <circle cx="880" cy="250" r="5" fill="#222"/>
  <circle cx="880" cy="310" r="5" fill="#222"/>

  <!-- ===== Legend ===== -->
  <g font-size="13" fill="#222">
    <line x1="230" y1="420" x2="260" y2="420" stroke="#d62828" stroke-width="4"/>
    <text x="268" y="425">Battery / 5 V power</text>
    <line x1="420" y1="420" x2="450" y2="420" stroke="#f77f00" stroke-width="4"/>
    <text x="458" y="425">3.3 V power</text>
    <line x1="570" y1="420" x2="600" y2="420" stroke="#222" stroke-width="4"/>
    <text x="608" y="425">Ground</text>
    <line x1="690" y1="420" x2="720" y2="420" stroke="#1d70b8" stroke-width="4"/>
    <text x="728" y="425">I²C data</text>
    <line x1="810" y1="420" x2="840" y2="420" stroke="#2a9d3f" stroke-width="4"/>
    <text x="848" y="425">I²C clock</text>
  </g>
</svg>
