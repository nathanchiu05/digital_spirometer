<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">
  <rect width="900" height="510" fill="#ffffff"/>

  <g stroke="#000" stroke-width="1.5" fill="none">
    <!-- Sheet border -->
    <rect x="10" y="10" width="880" height="490"/>

    <!-- ===== B1 battery (two-cell symbol) ===== -->
    <polyline points="210,160 80,160 80,235"/>
    <line x1="58" y1="235" x2="102" y2="235"/>
    <line x1="69" y1="245" x2="91" y2="245" stroke-width="4"/>
    <line x1="80" y1="245" x2="80" y2="255"/>
    <line x1="58" y1="255" x2="102" y2="255"/>
    <line x1="69" y1="265" x2="91" y2="265" stroke-width="4"/>
    <line x1="80" y1="265" x2="80" y2="440"/>

    <!-- ===== U1 charge / boost module ===== -->
    <rect x="210" y="120" width="140" height="170"/>
    <!-- RV1 potentiometer inside module -->
    <rect x="240" y="180" width="80" height="55" stroke-dasharray="4 3"/>
    <polyline points="248,205 256,205 260,197 268,213 276,197 284,213 292,197 300,213 304,205 312,205"/>
    <line x1="256" y1="225" x2="306" y2="188"/>
    <!-- BAT- to ground rail -->
    <polyline points="210,260 170,260 170,440"/>

    <!-- U1 OUT+ to U2 VIN -->
    <line x1="350" y1="160" x2="470" y2="160"/>
    <!-- U1 OUT- to ground rail -->
    <polyline points="350,260 390,260 390,440"/>

    <!-- ===== U2 ESP32 ===== -->
    <rect x="470" y="110" width="150" height="220"/>
    <!-- ESP32 left GND to rail -->
    <polyline points="470,260 430,260 430,440"/>

    <!-- ESP32 -> VL53L0X -->
    <line x1="620" y1="150" x2="720" y2="150"/>
    <line x1="620" y1="200" x2="720" y2="200"/>
    <line x1="620" y1="250" x2="720" y2="250"/>
    <line x1="620" y1="300" x2="720" y2="300"/>
    <!-- shared GND drop -->
    <line x1="670" y1="200" x2="670" y2="440"/>

    <!-- ===== U3 VL53L0X ===== -->
    <rect x="720" y="110" width="100" height="220"/>

    <!-- Ground rail -->
    <line x1="80" y1="440" x2="670" y2="440"/>

    <!-- Ground symbol -->
    <line x1="80" y1="440" x2="80" y2="465"/>
    <line x1="60" y1="465" x2="100" y2="465"/>
    <line x1="67" y1="472" x2="93" y2="472"/>
    <line x1="74" y1="479" x2="86" y2="479"/>

    <!-- IR beam to piston -->
    <line x1="820" y1="220" x2="868" y2="220"/>

  </g>

  <!-- Arrowheads -->
  <polygon points="306,188 296,191 301,198" fill="#000"/>
  <polygon points="880,220 866,214 866,226" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Junction dots -->
  <g fill="#000">
    <circle cx="80" cy="440" r="3.5"/>
    <circle cx="170" cy="440" r="3.5"/>
    <circle cx="390" cy="440" r="3.5"/>
    <circle cx="430" cy="440" r="3.5"/>
    <circle cx="670" cy="200" r="3.5"/>
  </g>

  <!-- ===== Labels ===== -->
  <!-- B1 -->
  <text x="104" y="232" font-size="13">+</text>
  <text x="104" y="250">B1</text>
  <text x="104" y="264">3.7V</text>
  <text x="104" y="278">1100mAh</text>
  <text x="140" y="152">+3.7V</text>

  <!-- U1 -->
  <text x="210" y="96">U1</text>
  <text x="210" y="111">CHARGE / BOOST</text>
  <text x="216" y="164">BAT+</text>
  <text x="216" y="264">BAT−</text>
  <text x="344" y="164" text-anchor="end">OUT+</text>
  <text x="344" y="264" text-anchor="end">OUT−</text>
  <text x="280" y="250" text-anchor="middle">RV1</text>
  <text x="280" y="264" text-anchor="middle" font-size="10">SET 5V</text>
  <text x="410" y="152" text-anchor="middle">+5V</text>

  <!-- U2 -->
  <text x="470" y="86">U2</text>
  <text x="470" y="101">ESP32 DEVKIT V1</text>
  <text x="476" y="164">VIN</text>
  <text x="476" y="264">GND</text>
  <text x="614" y="154" text-anchor="end">3V3</text>
  <text x="614" y="204" text-anchor="end">GND</text>
  <text x="614" y="254" text-anchor="end">D21</text>
  <text x="614" y="304" text-anchor="end">D22</text>
  <text x="645" y="142" text-anchor="middle">+3.3V</text>
  <text x="700" y="242" text-anchor="middle">SDA</text>
  <text x="700" y="292" text-anchor="middle">SCL</text>

  <!-- U3 -->
  <text x="720" y="86">U3</text>
  <text x="720" y="101">VL53L0X ToF</text>
  <text x="726" y="154">VIN</text>
  <text x="726" y="204">GND</text>
  <text x="726" y="254">SDA</text>
  <text x="726" y="304">SCL</text>
  <text x="852" y="244" text-anchor="middle" font-size="11">TO</text>
  <text x="852" y="258" text-anchor="middle" font-size="11">PISTON</text>

</svg>
