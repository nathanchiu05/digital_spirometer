; PlatformIO config for the Smart Spirometer sketches.
; The .ino files stay in their Arduino sketch folders; each env builds one.
;
;   pio run -e spirometer -t upload     full firmware
;   pio run -e toftest   -t upload      ToF sensor test only (Serial)
;   pio run -e tofweb    -t upload      ToF sensor test on phone (WiFi)
;   pio device monitor                  serial monitor (115200)

[platformio]
default_envs = spirometer

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:pio_sketch_dir.py
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.4

[env:spirometer]
custom_sketch_dir = SmartSpirometer
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.0
    bblanchon/ArduinoJson@^6.21.5

[env:toftest]
custom_sketch_dir = ToFTest

[env:tofweb]
custom_sketch_dir = ToFWeb
